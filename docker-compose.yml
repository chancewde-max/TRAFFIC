services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CAMERA_MODE: "mock"
      MAX_ACTIVE_CAMERAS: "16"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: "http://localhost:8000"
        VITE_WS_BASE: "ws://localhost:8000"
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_data:
